<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="CSS/style.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">

</head>

<body>
    <h1 class="text-center">To do Application</h1>

    <hr>

    <div class="container">
        <div class="card">
            <div class="card-body">
                <h3 class="text-center mb-5">Create new Task</h3>
                <div class="row">
                    <div class="col">
                        <input id="lblTitle" type="text" class="form-control" placeholder="Enter Title" aria-label="First name">
                    </div>
                    <div class="col">
                        <input id="lblDescription" type="text" class="form-control" placeholder="Enter Description" aria-label="Last name">
                    </div>
                </div>
               <button class="justify-content-center mt-5" onclick="btnAdd()" type="button" class="btn-solid theme-primary">Add new ToDo task</button>
            </div>
        </div>
    </div>
    <br><br>
    <table class="container">
        <tr id="toDoCards">

        </tr>

    </table>


    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>

</html>
