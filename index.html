<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="CSS/style.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">

</head>

<body>
    <h1>TO do Application</h1>

    <div>
        <div class="row">
            <div class="sm:col-6 mb-3 sm:mb-0">
                <div class="card">
                    <div class="card-body">
                        <input id="lblTitle" type="text" class="form-control" placeholder="Enter Title" >
                        <input id="lblDescription" type="text" class="form-control" placeholder="Enter Description" >
                        <button onclick="btnAdd()" type="button" class="btn-solid theme-primary">ADD</button>
                    </div>
                </div>
            </div>
        </div>

        <br><br>

        <div class="card text-center">
            <div class="card-header">
                Date
            </div>
            <div class="card-body">
                <h4 class="card-title">Title</h4>
                <p class="card-text">Description</p>
                <div class="container">
                    <button type="button" class="btn-outline theme-primary">✎</button>
                    <button type="button" class="btn-outline theme-danger">🗑</button>
                    <button type="button" class="btn-outline theme-success">✓</button>
                </div>
            </div>
            <div class="card-footer fg-2">
                ToDo works
            </div>
        </div>

        <div id="toDoCards">

        </div>


        <script src="script.js"></script>
</body>

</html>
